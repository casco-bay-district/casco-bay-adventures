name: Suggest a location
description: Tell us about a campsite, trail, lock-in site, or High Adventure trip to add to the directory.
title: "Suggest: "
labels: ["location"]
body:
  - type: input
    id: name
    attributes: { label: Name of the place }
    validations: { required: true }
  - type: input
    id: where
    attributes: { label: Town and state }
    validations: { required: true }
  - type: textarea
    id: why
    attributes:
      label: What is it good for?
      description: Program levels (Cub Scouts, Scouts BSA, Venturing, Sea Scouting), activities, amenities, anything a unit leader should know.
  - type: input
    id: contact
    attributes:
      label: Website or contact info
      description: Public venue contact only. Please do not include a volunteer's personal phone or email.
