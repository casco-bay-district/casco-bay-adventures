name: Refresh location snapshot

# Saves a copy of the Google Sheet data into the repo every 6 hours, so the public
# site still works if Google's backend is slow or down. Only commits when data changed.
# Run it by hand any time: Actions tab -> "Refresh location snapshot" -> Run workflow.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build snapshot
        run: node scripts/build-snapshot.mjs
      - name: Commit if changed
        run: |
          git config user.name "district-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/locations.snapshot.json
          git diff --cached --quiet || (git commit -m "Refresh location snapshot" && git push)
